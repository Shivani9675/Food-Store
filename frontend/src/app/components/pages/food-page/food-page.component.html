<app-not-found
  [visible]="!food"
  resetLinkRoute="/foods"
  resetLinkText="Home"
>
</app-not-found>
<div *ngIf="food" class="container">
  <img [src]="food.imageUrl" [alt]="food.name" />

  <div class="details">
    <div class="header">
      <span class="name">
        {{ food.name }}
      </span>
      <span class="favorite {{ food.favorite ? '' : 'not' }}"> ❤ </span>
    </div>

    <div class="rating">
      <star-rating [stars]="food.rating" [size]="1.8"/>
    </div>

    <div class="origins">
      <span *ngFor="let origin of food.origins">
        {{ origin }}
      </span>
    </div>

    <div class="tags">
      <a *ngFor="let tag of food.tags" routerLink="/tag/{{ tag }}">
        {{ tag }}
      </a>
    </div>

    <div class="cook-time">
      <span>
        Time to cook about <strong>{{ food.deliveryTime }}</strong> minutes
      </span>
    </div>

    <div class="price">
      <span>
        {{ food.price | currency: 'INR' }}
      </span>
    </div>

    <button (click)="addToCart()">Add To cart</button>
  </div>
</div>
